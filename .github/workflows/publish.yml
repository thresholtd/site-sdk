name: Publish site SDK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable version tag, such as v2.1.0
        type: string
        required: true
      mode:
        description: Publish a new version or complete an observed publication
        type: choice
        options: [publish, release-only]
        default: publish
        required: true
      source_commit:
        description: Full reviewed source commit for release-only recovery
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: site-sdk-publication
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PUBLICATION_MODE: ${{ inputs.mode }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.mode == 'release-only' && inputs.source_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
          scope: '@thresho'
      - name: Record runtime versions
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
      - name: Verify generated artifacts
        run: node scripts/verify-package.mjs --tag "$RELEASE_TAG"
      - name: Publish immutable artifacts
        run: |
          if [ "$PUBLICATION_MODE" = "release-only" ]; then
            node scripts/publish.mjs release-only --tag "$RELEASE_TAG" --source-commit "$SOURCE_COMMIT"
          else
            node scripts/publish.mjs publish --tag "$RELEASE_TAG"
          fi
